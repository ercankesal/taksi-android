name: Android APK Build
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Show original manifest
        run: cat android/app/src/main/AndroidManifest.xml

      - name: Patch AndroidManifest with all needed permissions and cleartext
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # Create network security config file
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'NETCFG'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          NETCFG

          # Add location permissions right after the INTERNET permission line
          if ! grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
          fi

          # Add cleartext + networkSecurityConfig to <application ...>
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application |<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config" |' "$MANIFEST"
          fi

          echo "=== Patched manifest ==="
          cat "$MANIFEST"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tail -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taksi-surucu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
