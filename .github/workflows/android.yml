name: Android APK Build
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>' > android/app/src/main/res/xml/network_security_config.xml

          # Use awk for safer multi-line replacement
          awk '
          /<manifest / && !done {
            print
            while ((getline line) > 0) {
              if (line ~ /<uses-permission /) {
                print line
              } else if (line ~ /<\/manifest>/) {
                # insert permissions before </manifest>
                print "    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.ACCESS_BACKGROUND_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />"
                print "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_LOCATION\" />"
                print "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />"
                print "    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />"
                print line
                done = 1
              } else {
                print line
              }
            }
            next
          }
          /<application / && !app_done {
            sub(/<application /, "<application android:usesCleartextTraffic=\"true\" android:networkSecurityConfig=\"@xml/network_security_config\" ")
            app_done = 1
          }
          { print }
          ' $MANIFEST > $MANIFEST.new && mv $MANIFEST.new $MANIFEST
          cat $MANIFEST

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tail -30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taksi-surucu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
