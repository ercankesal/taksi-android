name: Android APK Build
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch AndroidManifest with permissions and cleartext
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "=== Original manifest ==="
          cat $MANIFEST

          # Network security config dosyası oluştur
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="true">
        <trust-anchors>
            <certificates src="system" />
        </trust-anchors>
    </base-config>
</network-security-config>
EOF

          # Python ile güvenli manifest patch
          python3 <<'PYEOF'
import re
import sys

path = "android/app/src/main/AndroidManifest.xml"
with open(path) as f:
    content = f.read()

# İzinleri ekle (eğer yoksa)
perms = [
    'android.permission.ACCESS_FINE_LOCATION',
    'android.permission.ACCESS_COARSE_LOCATION',
    'android.permission.ACCESS_BACKGROUND_LOCATION',
    'android.permission.FOREGROUND_SERVICE',
    'android.permission.FOREGROUND_SERVICE_LOCATION',
    'android.permission.POST_NOTIFICATIONS',
    'android.permission.WAKE_LOCK'
]
for p in perms:
    if p not in content:
        content = content.replace(
            '<uses-permission android:name="android.permission.INTERNET" />',
            f'<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="{p}" />'
        )

# application tag'ine cleartext ve network config ekle
if 'usesCleartextTraffic' not in content:
    content = re.sub(
        r'<application ',
        '<application\n        android:usesCleartextTraffic="true"\n        android:networkSecurityConfig="@xml/network_security_config"\n        ',
        content,
        count=1
    )

with open(path, 'w') as f:
    f.write(content)

print("=== Patched manifest ===")
print(content)
PYEOF

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taksi-surucu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
